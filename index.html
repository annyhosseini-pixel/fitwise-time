<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>The FitWise — Время</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:var(--tg-theme-text-color,#17252a);background:var(--tg-theme-bg-color,#f5f7f6);font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}main{max-width:440px;margin:auto}.brand{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--tg-theme-hint-color,#667873);margin:8px 0 30px}.tag{font-size:12px;color:var(--tg-theme-hint-color,#667873)}h1{font-size:28px;letter-spacing:-.03em;margin:8px 0 12px;line-height:1.15}#task{font-size:15px;line-height:1.45;margin:0 0 8px;overflow-wrap:anywhere}p{line-height:1.5;font-size:14px;color:var(--tg-theme-hint-color,#667873)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0 20px}label{font-size:14px;font-weight:600}input{display:block;width:100%;margin-top:9px;padding:18px 14px;font:500 36px system-ui;color:inherit;background:var(--tg-theme-secondary-bg-color,#fff);border:1px solid #8b9f963d;border-radius:16px;outline:none}input:focus{border-color:var(--tg-theme-button-color,#28765c);box-shadow:0 0 0 3px #28765c18}.summary{padding:20px;border-radius:16px;background:var(--tg-theme-secondary-bg-color,#fff)}#result{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}button{width:100%;padding:17px;border:0;border-radius:14px;background:var(--tg-theme-button-color,#28765c);color:var(--tg-theme-button-text-color,#fff);font:600 16px system-ui;margin-top:24px;cursor:pointer}button:disabled{opacity:.45;cursor:default}#status{min-height:24px;margin-bottom:0}#status.error{color:var(--tg-theme-destructive-text-color,#b64132)}.foot{font-size:12px;margin-top:12px;text-align:center}#cancel{margin-top:8px;background:none;color:var(--tg-theme-link-color,#28765c);padding:12px}
</style></head><body><main><div class="brand">The FitWise Assistant</div><div class="tag" id="tag"></div><h1 id="heading"></h1><div id="task"></div><p id="intro"></p><form id="form" novalidate><div class="fields"><label><span id="hoursLabel"></span><input id="hours" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" value="0" autocomplete="off" required></label><label><span id="minutesLabel"></span><input id="minutes" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="0" autocomplete="off" required></label></div><div class="summary"><div class="tag" id="summaryLabel"></div><div id="result" aria-live="polite">0:00 / 0,0000</div></div><p id="status" role="status" aria-live="polite"></p><button id="submit" type="submit"></button><p class="foot" id="foot"></p></form><button id="cancel" type="button"></button></main>
<script>
'use strict';
const params=new URLSearchParams(location.hash.slice(1)), en=params.get('lang')==='en', preview=params.get('preview')==='1', nonce=params.get('nonce')||'', tg=window.Telegram&&window.Telegram.WebApp;
const words=en?{tag:'TIME ENTRY',heading:'Time spent',intro:'Enter only the additional time for this submission.',hours:'Hours',minutes:'Minutes',summary:'Hours : minutes / Decimal hours',submit:'Continue',cancel:'Cancel',foot:'Time is recorded only after confirmation in the bot.',invalid:'Enter whole hours and minutes from 0 to 59. Time must be greater than zero.',outside:'Open this window using Enter time in the bot.',done:'Time sent for confirmation.',preview:'Preview: no time will be recorded.'}:{tag:'ВВОД ВРЕМЕНИ',heading:'Затраченное время',intro:'Укажите только дополнительное время этой сдачи.',hours:'Часы',minutes:'Минуты',summary:'Часы : минуты / Десятичные часы',submit:'Продолжить',cancel:'Отмена',foot:'Время учитывается только после подтверждения в боте.',invalid:'Введите целые часы и минуты от 0 до 59. Время должно быть больше нуля.',outside:'Откройте окно кнопкой «Ввести время» в боте.',done:'Время отправлено на подтверждение.',preview:'Предпросмотр: часы не записываются.'};
const $=id=>document.getElementById(id);
for(const [id,key] of Object.entries({tag:'tag',heading:'heading',intro:'intro',hoursLabel:'hours',minutesLabel:'minutes',summaryLabel:'summary',submit:'submit',cancel:'cancel',foot:'foot'}))$(id).textContent=words[key];
document.documentElement.lang=en?'en':'ru';$('task').textContent=(params.get('task')||'').slice(0,300);
function parseTime(h,m){if(!/^\d{1,5}$/.test(h)||!/^\d{1,2}$/.test(m)||Number(m)>59||Number(h)*60+Number(m)<=0)return null;return{hours:Number(h),minutes:Number(m)};}
function update(){const v=parseTime($('hours').value.trim(),$('minutes').value.trim());$('result').textContent=v?v.hours+':'+String(v.minutes).padStart(2,'0')+' / '+((v.hours*60+v.minutes)/60).toFixed(4).replace('.',en?'.':','):'— / —';$('submit').disabled=!v;return v;}
for(const id of ['hours','minutes']){$(id).addEventListener('input',update);$(id).addEventListener('focus',()=>$(id).select());}
const supported=!!(tg&&tg.platform!=='unknown'&&typeof tg.sendData==='function'&&/^[a-f0-9-]{36}$/i.test(nonce));
if(tg){tg.ready();}
if(!supported&&!preview){$('status').textContent=words.outside;$('form').hidden=true;}else if(preview)$('status').textContent=words.preview;
$('cancel').addEventListener('click',()=>{if(supported)tg.close();else if(preview){$('hours').value='0';$('minutes').value='0';update();}});
$('form').addEventListener('submit',event=>{event.preventDefault();const v=update();if(!v){$('status').textContent=words.invalid;$('status').className='error';return;}if(preview){$('status').textContent=words.preview+' '+$('result').textContent;return;}if(!supported)return;$('submit').disabled=true;try{tg.sendData(JSON.stringify({type:'fitwise-time-v1',nonce,hours:v.hours,minutes:v.minutes}));$('status').textContent=words.done;}catch(err){$('submit').disabled=false;$('status').textContent=words.outside;$('status').className='error';}});
update();
</script></body></html>
